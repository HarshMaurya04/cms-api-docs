
openapi: 3.0.1

info:
  title: Story Creation Service
  description: This is the Story Creation API for submitting test and practice stories and initiating asynchronous PED processing.
  contact:
    email: nageshnayak@iitb.ac.in
  version: 2.0.0

servers:
  - url: https://g8runbu52d.execute-api.ap-south-1.amazonaws.com/prod

paths:
  /story:
    post:
      summary: Submit a test or practice story for processing
      operationId: CreateStory
      description: |
        Submit the request using multipart/form-data.

        For a test story:
        - Set contentType to test.
        - Provide storyContent as a single paragraph containing a maximum of 120 words.

        For a practice story:
        - Set contentType to practice.
        - Upload practiceContent as a JSON file.
        - Upload the practice audio as an MP3 file using audioFile.

        For a combined test and practice story:
        - Set contentType to both.
        - Provide storyContent as a single paragraph containing a maximum of 120 words.
        - Upload practiceContent as a JSON file.
        - Upload the practice audio as an MP3 file using audioFile.

        The thumbnail field is optional for all request types.
        The thumbnail must be a JPG/JPEG image with dimensions of exactly
        630 x 360 pixels and a maximum size of 150 KiB.

        For contentType both, test and practice processing are initiated separately,
        one after the other, using the same storyId. The asynchronous responses
        are received separately for test and practice.

      requestBody:
        description: Story creation request using multipart/form-data.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - contentType
                - storyTitle
                - language
                - uuid
                - grade
              properties:
                contentType:
                  type: string
                  enum:
                    - test
                    - practice
                    - both
                  description: |
                    Select test, practice, or both.
                    Required fields depend on the selected contentType.

                storyTitle:
                  type: string
                  maxLength: 64
                  description: Story title, maximum 64 characters including spaces.

                storyContent:
                  type: string
                  minLength: 10
                  description: |
                    Required for test and both.
                    Must contain a single paragraph with a maximum of 120 words.

                practiceContent:
                  type: string
                  format: binary
                  description: |
                    Required for practice and both.
                    Upload a JSON file containing a non-empty screens array.
                    Each screen must contain st, et, and a non-empty words array.
                    Each word must contain w, st, and et.

                audioFile:
                  type: string
                  format: binary
                  description: |
                    Required for practice and both.
                    Upload an MP3 file with a maximum size of 2.5 MiB.

                language:
                  type: string
                  enum:
                    - EN
                  description: Supported language code is EN.

                uuid:
                  type: string
                  description: Client-generated UUID7, 36 characters including hyphens.

                grade:
                  type: integer
                  minimum: 1
                  maximum: 8
                  description: Target grade for which the story is intended.

                thumbnail:
                  type: string
                  format: binary
                  description: |
                    Optional JPG/JPEG image, exactly 630 x 360 pixels,
                    maximum size 150 KiB (153,600 bytes).

            encoding:
              practiceContent:
                contentType: application/json
              audioFile:
                contentType: audio/mpeg
              thumbnail:
                contentType: image/jpeg

      responses:
        "200":
          description: Story accepted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryRes"

        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRes"

        "403":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRes"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRes"

      security:
        - ApiKeyAuth: []

      x-codegen-request-body-name: body

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key required to access the endpoint.

  schemas:
    StoryRes:
      type: object
      properties:
        status:
          type: string
          description: Status of the request.
          example: success

        uuid:
          type: string
          description: Client-generated UUID echoed back in the response.

        storyId:
          type: string
          description: Server-generated Story UUID7.

        message:
          type: string
          description: Response message indicating the request result.

    ErrorRes:
      type: object
      properties:
        status:
          type: string
          description: Status of the request.
          example: error

        error:
          type: string
          description: Error code identifying the failure.
          example: InvalidRequest

        message:
          type: string
          description: Error message describing the validation failure or request error.
          example: Invalid request.
